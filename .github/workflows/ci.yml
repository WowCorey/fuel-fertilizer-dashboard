name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check compiled dashboard JS
        run: npm run check:ui

      - name: Run UI unit tests
        run: npm run test:ui-unit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile scripts
        run: python -m py_compile scripts/*.py

      - name: Check source manifest
        run: python scripts/build_source_manifest.py --check

      - name: Check governed canonical source URLs
        run: python scripts/apply_source_url_governance.py --check

      - name: Validate source registry, envelopes and URL governance
        run: python scripts/validate_project.py

      - name: Check committed Trust Status v2 manifest
        run: python scripts/build_trust_status.py --check

      - name: Validate Trust Status v2
        run: python scripts/validate_trust_status_v2.py

      - name: Validate national status-model readiness gate
        run: python scripts/validate_national_status_gate.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run browser smoke tests
        run: npm run smoke:ui

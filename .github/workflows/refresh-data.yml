name: Weekly data refresh

# Refreshes programmatic data sources and commits changed JSON after schema
# validation. Blocking URL checks remain limited to machine fetch URLs. Public
# landing-page health is classified separately and stays advisory.

on:
  schedule:
    # 02:00 AEST on Monday = 16:00 UTC on Sunday (AEST is UTC+10, no DST in QLD)
    - cron: "0 16 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check programmatic fetch URLs
        run: python scripts/fetch_data.py --check

      - name: Fetch programmatic sources
        env:
          NSW_FUELCHECK_API_KEY: ${{ secrets.NSW_FUELCHECK_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Ensure manual stub files exist
        run: python scripts/init_manual_stubs.py

      - name: Build source manifest
        run: python scripts/build_source_manifest.py

      - name: Apply governed canonical source URLs
        run: python scripts/apply_source_url_governance.py

      - name: Classify source landing-page link health
        continue-on-error: true
        run: python scripts/check_source_links.py

      - name: Validate source registry, envelopes and URL governance
        run: python scripts/validate_project.py

      - name: Write last successful refresh marker
        run: python scripts/write_refresh_status.py

      - name: Build Trust Status v2
        run: python scripts/build_trust_status.py

      - name: Validate Trust Status v2
        run: python scripts/validate_trust_status_v2.py

      - name: Commit any changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "chore(data): weekly refresh $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No data changes; nothing to commit."
          fi
